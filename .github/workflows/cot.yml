name: Weekly COT Bot

on:
  schedule:
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run bot
        run: python cot_bot.py
